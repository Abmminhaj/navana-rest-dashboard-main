name: Backup Database

on:
  schedule:
    # Every Sunday at 02:00 Dhaka time (20:00 UTC Saturday).
    - cron: "0 20 * * 6"
  workflow_dispatch: {}
  # Verify a real backup before merging this repair into main.
  push:
    branches: [fix/database-backups]
    paths:
      - .github/workflows/backup.yml
      - scripts/**
      - tests/test*backup*.py
      - config/backup-recipients.txt

permissions:
  contents: write

concurrency:
  group: navana-database-backup
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate backup configuration without exposing credentials
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 scripts/backup_cli.py validate-config

      - name: Install PostgreSQL 18 client and age
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          sudo install -D -m 644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18 age
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"

      - name: Test failed dumps and encrypted backup verification
        run: python3 -m unittest discover -s tests -v

      - name: Create, validate and encrypt database backup
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/backup_cli.py backup --output-dir "$RUNNER_TEMP/navana-backup-publish"

      - name: Upload encrypted backup for independent verification
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/navana-backup-publish/*.sql.gz.age
            ${{ runner.temp }}/navana-backup-publish/*.metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified encrypted backup on main only
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          mkdir -p db-backups
          cp -- "$RUNNER_TEMP/navana-backup-publish/"*.sql.gz.age db-backups/
          cp -- "$RUNNER_TEMP/navana-backup-publish/"*.metadata.json db-backups/
          git config user.name 'Navana Backup Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- db-backups/*.sql.gz.age db-backups/*.metadata.json
          if ! git diff --cached --quiet; then
            git commit -m "Automated encrypted backup: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:main
          fi
