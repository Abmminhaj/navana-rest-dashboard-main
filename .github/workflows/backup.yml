name: Backup Database

on:
  schedule:
    # Every Sunday at 02:00 Dhaka time (20:00 UTC Saturday)
    - cron: "0 20 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p db-backups
          FILENAME="db-backups/backup-$(date +%Y-%m-%d).sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > "$FILENAME"
          echo "Created $FILENAME ($(du -h "$FILENAME" | cut -f1))"

      - name: Delete backups older than 180 days
        run: |
          find db-backups -name "backup-*.sql.gz" -mtime +180 -delete || true

      - name: Commit and push backup
        run: |
          git config user.name "Navana Backup Bot"
          git config user.email "backup-bot@navana-rest-house.internal"
          git add db-backups/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Automated backup: $(date +%Y-%m-%d)"
          git push
