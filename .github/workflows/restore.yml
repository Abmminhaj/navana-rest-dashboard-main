name: Restore Database (recovery instructions)

# Encrypted backups require the private recovery key, which stays offline.
# Keep the old entry point visible, but never run legacy gunzip | psql.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Require verified encrypted recovery
        shell: bash
        run: |
          echo '::error::Encrypted backups require local verification with the private recovery key. No database was touched.'
          echo 'Follow docs/database-backups.md: verify the encrypted backup, then rehearse recovery in an isolated compatible database.'
          echo 'Legacy 20-byte .sql.gz files are empty and must not be restored.'
          exit 1
